[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "km003c-mcp"
# The version comes from the newest `vX.Y.Z` git tag; see [tool.hatch.version].
dynamic = ["version"]
description = "MCP server for the ChargerLab POWER-Z KM003C USB-C power meter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pyusb>=1.2",
    "libusb-package",
    "pyserial>=3.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
km003c-mcp = "km003c_mcp.server:main"
km003c-capture = "km003c_mcp.cli:main"

[tool.hatch.version]
# hatch-vcs reads the version from git at build time. A tagged commit gets the tag's
# version, such as 0.2.1. A later commit gets the next patch version with a development
# suffix that names the commit, such as 0.2.2.dev3+g724c1c3.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/km003c_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["hw: requires a real KM003C (set KM003C_HW=1)"]

[tool.ruff.lint]
# The ruff 0.17 default rule set flags 33 findings in the upstream code (import
# order, UP035, S110, and others). Select the classic pyflakes and pycodestyle
# error subset so `ruff check` gates real errors without rewriting upstream code.
select = ["E4", "E7", "E9", "F"]
