[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "km003c-mcp"
version = "0.1.0"
description = "MCP server for the ChargerLab POWER-Z KM003C USB-C power meter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pyusb>=1.2",
    "libusb-package",
    "pyserial>=3.5",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
km003c-mcp = "km003c_mcp.server:main"
km003c-capture = "km003c_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/km003c_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["hw: requires a real KM003C (set KM003C_HW=1)"]

[tool.ruff.lint]
# The ruff 0.17 default rule set flags 33 findings in the upstream code (import
# order, UP035, S110, and others). Select the classic pyflakes and pycodestyle
# error subset so `ruff check` gates real errors without rewriting upstream code.
select = ["E4", "E7", "E9", "F"]
